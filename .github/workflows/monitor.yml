name: KinoKlik Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Consecutive-failure state is persisted to a dedicated "state" branch
      # (a fresh orphan commit every run, never accumulating history) rather
      # than the default branch, since GitHub Actions runners are ephemeral
      # and monitor.db would otherwise reset to empty on every run, and
      # committing it to master would spam the visible commit history every
      # 5 minutes.
      - name: Restore previous state
        run: |
          git fetch origin state 2>/dev/null || true
          git show origin/state:monitor.db > monitor.db 2>/dev/null || echo "no prior state, starting fresh"

      - name: Build monitor
        run: go build -o monitor ./cmd/monitor

      # Exit code 1 (a target is down) is expected and shouldn't fail the
      # job, since that would skip the state-saving step below. Discord is
      # the actual alerting channel; this job's own pass/fail status is not.
      - name: Run checks
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HEALTH_CHECK_KEY: ${{ secrets.HEALTH_CHECK_KEY }}
        run: |
          ./monitor \
            -urls "https://www.kinoklik.ca,https://www.kinoklik.ca/health" \
            -header "X-Health-Key: ${HEALTH_CHECK_KEY}" \
            -webhook "${DISCORD_WEBHOOK_URL}" \
            -db monitor.db

      - name: Save state
        run: |
          git config user.name "kinoklik-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan state-tmp
          git rm -rf --cached . >/dev/null
          git add -f monitor.db
          git commit -m "state update"
          git push origin state-tmp:state --force

      # Separate from the -webhook alerting above: this fires when the pipeline
      # itself breaks (checkout, go build, git push, etc.), which the monitor
      # binary can never detect or report on its own. "Run checks" above has
      # continue-on-error, so a target being down does not trip failure() here
      # and does not double-alert.
      - name: Notify Discord on pipeline failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set, skipping Discord notification"
            exit 0
          fi
          payload=$(jq -n \
            --arg title "Uptime monitor pipeline failed" \
            --arg desc "The monitor job itself errored (not a target outage -- that is alerted separately by the monitor binary).
[View run]($RUN_URL)" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{title: $title, description: $desc, color: 15548997, timestamp: $ts}]}')
          curl -sf -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"
